<p>courses-list works!</p>

<ng-container *ngFor="let course of courses">
  <app-course-card
    [course]="course"
    [editable]="editable"
    (showCourse)="showCourse.emit($event)"
    (editCourse)="editCourse.emit($event)"
    (deleteCourse)="deleteCourse.emit($event)">
  </app-course-card>
</ng-container>

<h2 class="text-align-center">Registration</h2>
<div class="app-plate">
  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" #regForm="ngForm">
    <div class="registration-form">
      <div>
        <div class="form__control">
          <!-- NAME -->
          <label for="name">Name</label>
          <!--Use the name `name` for the form control.-->
          <input type="text" id="name" placeholder="Input text" formControlName="name"/>
          <span id="nameErrorMessage" class="text-danger"
            *ngIf="registrationForm.get('name')?.hasError('required')
              && (registrationForm.get('name')?.touched || regForm.submitted)">
              Name is required.
          </span>
          <span class="text-danger"
            *ngIf="registrationForm.get('name')?.hasError('minlength')
              && (registrationForm.get('name')?.touched || regForm.submitted)">
            Name must be at least 6 characters.
          </span>
        </div>
        <div class="form__control">
          <!--Use the name `email` for the form control.-->
          <!-- EMAIL -->

          <label for="email">Email</label>
          <input type="text" id="email" placeholder="Input text" formControlName="email" emailValidator/>
          <span id="emailErrorMessage" class="text-danger" 
            *ngIf="registrationForm.get('email')?.hasError('required')
              && (registrationForm.get('email')?.touched || regForm.submitted)">
              Email is required.
          </span>
          <span class="text-danger"
            *ngIf="registrationForm.get('email')?.hasError('invalidEmail')
              && (registrationForm.get('email')?.touched || regForm.submitted)">
            Enter a valid email.
          </span>
        </div>
        <div class="form__control">
          <!--Use the name `password` for the form control.-->
          <!-- PASSWORD -->
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Input text" formControlName="password"/>
          <span id="passwordErrorMessage" class="text-danger"
            *ngIf="registrationForm.get('password')?.hasError('required')
              && (registrationForm.get('password')?.touched || regForm.submitted)">
              Password is required.</span>
        </div>
      </div>
      <div class="form__action">
        <app-button></app-button>
      </div>
      <pre>submitted: {{ regForm.submitted }}</pre>
    </div>
  </form>
</div>

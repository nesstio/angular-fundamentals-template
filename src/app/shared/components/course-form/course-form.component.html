<!-- Replace ::text:: with your code -->
<h2>Create / Edit Course</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="app-plate">
    <div class="course">
      <h3>Main Info</h3>
      <div class="form__control">
        <label for="title">Title</label>
        <!--Use the name `title` for the form control.-->
        <input type="text" id="title" placeholder="Input text" formControlName="title"/>
        <span id="titleErrorMessage" class="text-danger" *ngIf="controlInvalid(title)">Title is required.</span>
      </div>
      <div class="form__control">
        <label for="description">Description</label>
        <!--Use the name `description` for the form control.-->
        <textarea
          id="description"
          formControlName="description"
          placeholder="Input text"
          rows="4"
          cols="5"
        ></textarea>
        <span id="descriptionErrorMessage" class="text-danger" *ngIf="controlInvalid(description)">Description is required.</span>
      </div>
      <div class="separator"></div>

      <h3>Authors</h3>
      <div class="form__control">
        <div class="course__flex"  formGroupName="newAuthor">
          <!--Use the name `author` for the form control.-->
          <input type="text" id="author" placeholder="Input Author Name" formControlName="author"/>
          <app-button id="createAuthor" (click)="createAuthor()" [attr.type]="'button'"></app-button>
        </div>
        <span id="authorErrorMessage" class="text-danger" *ngIf="controlInvalid(newAuthorName)">New author should contain only latin letters and numbers.</span>
        <div class="course__authors">
          <!--Use the name `authors` for the form array.-->

          <div class="authors__col">
            <h4>All authors</h4>
            <ul>
              <li *ngFor="let a of availableAuthors; trackBy: trackByAuthorId">
                <span>{{ a.name }}</span>
                <button type="button" (click)="addExistingAuthor(a)">Add author</button>
              </li>
            </ul>
        </div>

        <div class="authors__col" formArrayName="authors">
          <h4>Course authors</h4>
          <ul>
            <li *ngFor="let ctrl of authorsFA.controls; let i = index">
              <input [formControlName]="i" type="hidden" />
              <span class="author-name">{{ authorNameById(ctrl.value) }}</span>
              <button type="button"
                      (click)="removeCourseAuthor({ id: ctrl.value, name: authorNameById(ctrl.value) })">
                Delete author
              </button>
            </li>
          </ul>
        </div>
      </div>
      </div>



      <div class="separator"></div>
      <h3>Duration</h3>
      <div class="form__control">
        <div class="course__flex">
          <!--Use the name `duration` for the form array.-->
          <input type="number" id="duration" placeholder="Input duration" formControlName="duration" min="0"/>
          <div class="course__duration">
            {{ minutesToHhMm(duration?.value) }}
          </div>
        </div>
        <span id="durationErrorMessage" class="text-danger" *ngIf="controlInvalid(duration)">Duration is required.</span>
      </div>
      <div class="form__action">
        <app-button></app-button>
      </div>
    </div>
  </div>
</form>

<h2 class="text-align-center">Login</h2>
<div class="app-plate">
  <form #loginForm="ngForm">
    <div class="login-form">
      <div>
        <div class="form__control">
          <label for="email">Email</label>
          <!--Use the name `email` for the form control.-->
          <input type="text" id="email" placeholder="Input text"
            name="email"
            [(ngModel)]="email"
            required
            emailValidator
            #emailCtrl="ngModel"
            />
          <span id="emailErrorMessage" class="text-danger" 
            *ngIf="emailCtrl.errors?.['required'] && (emailCtrl.touched || loginForm.submitted)">
            Email is required.</span>
        </div>
        <span class="text-danger"
      *ngIf="emailCtrl.errors?.['invalidEmail'] && (emailCtrl.touched || loginForm.submitted)">
  Enter a valid email.
</span>
        <div class="form__control">
          <label for="password">Password</label>
          <!--Use the name `password` for the form control.-->
          <input type="password" id="password" placeholder="Input text"
            name="password"
            [(ngModel)]="password"
            required
            #passwordCtrl="ngModel"
            />
          <span id="passwordErrorMessage" class="text-danger"
            *ngIf="passwordCtrl.errors?.['required'] && (passwordCtrl.touched || loginForm.submitted)">
            Password is required.</span>
        </div>
      </div>
      <div>
        <div class="form__action">
          <app-button></app-button>
        </div>
        <div class="form__text">
          If you don't have an account you may <strong>Registration</strong>
        </div>
        <pre>submitted: {{ loginForm.submitted }}</pre>

      </div>
    </div>
  </form>
</div>
